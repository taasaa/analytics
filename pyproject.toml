[tool.poetry]
name = "analytics"
version = "0.1.0"
description = "Home infrastructure observability analytics"
authors = ["Rut"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
psycopg2-binary = "^2.9"
rich = "^13.0"
click = "^8.0"
python-dotenv = "^1.0"
pyyaml = "^6.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0"
pytest-cov = "^4.0"

[tool.poetry.scripts]
analytics = "analytics.cli:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"